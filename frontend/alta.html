<script>

/* =====================================
   PEGAR PACIENTE DA URL
===================================== */

const parametros =
  new URLSearchParams(
    window.location.search
  );


const paciente =
  parametros.get("paciente");


if (paciente) {

  const nomeDecodificado =
    decodeURIComponent(paciente);


  document.getElementById(
    "nomePaciente"
  ).textContent =
    nomeDecodificado;


  document.getElementById(
    "nome"
  ).value =
    nomeDecodificado;

}


/* =====================================
   DATA ATUAL
===================================== */

const hoje =
  new Date()
    .toISOString()
    .split("T")[0];


document.getElementById(
  "dataAlta"
).value = hoje;


/* =====================================
   ENVIAR ALTA
===================================== */

document
  .getElementById("formAlta")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const dadosAlta = {

        paciente:
          document.getElementById(
            "nome"
          ).value,

        nascimento:
          document.getElementById(
            "nascimento"
          ).value,

        cpf:
          document.getElementById(
            "cpf"
          ).value,

        telefone:
          document.getElementById(
            "telefone"
          ).value,

        dataEntrada:
          document.getElementById(
            "dataEntrada"
          ).value,

        dataAlta:
          document.getElementById(
            "dataAlta"
          ).value,

        setor:
          document.getElementById(
            "setor"
          ).value,

        leito:
          document.getElementById(
            "leito"
          ).value,

        diagnosticoEntrada:
          document.getElementById(
            "diagnosticoEntrada"
          ).value,

        diagnosticoFinal:
          document.getElementById(
            "diagnosticoFinal"
          ).value,

        tratamento:
          document.getElementById(
            "tratamento"
          ).value,

        estado:
          document.getElementById(
            "estado"
          ).value,

        tipoAlta:
          document.getElementById(
            "tipoAlta"
          ).value,

        semFebre:
          document.getElementById(
            "semFebre"
          ).checked,

        alimentacao:
          document.getElementById(
            "alimentacao"
          ).checked,

        clinicamenteEstavel:
          document.getElementById(
            "medicamenteEstavel"
          ).checked,

        medicamentos:
          document.getElementById(
            "medicamentos"
          ).value,

        cuidadosMedicamentos:
          document.getElementById(
            "cuidadosMedicamentos"
          ).value,

        orientacoes:
          document.getElementById(
            "orientacoes"
          ).value,

        retorno:
          document.getElementById(
            "retorno"
          ).value,

        especialidade:
          document.getElementById(
            "especialidade"
          ).value,

        sinaisAlerta:
          document.getElementById(
            "sinaisAlerta"
          ).value,

        medico:
          document.getElementById(
            "medico"
          ).value,

        crm:
          document.getElementById(
            "crm"
          ).value,

        observacoes:
          document.getElementById(
            "observacoes"
          ).value

      };


      try {

        const resposta =
          await fetch("/alta", {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(dadosAlta)

          });


        const data =
          await resposta.json();


        if (!resposta.ok) {

          throw new Error(
            data.erro ||
            "Erro ao registrar alta."
          );

        }


        alert(
          "✅ Alta hospitalar registrada com sucesso!"
        );


        window.location.href =
          "medico.html";

      }

      catch (erro) {

        console.error(erro);

        alert(
          "Não foi possível registrar a alta."
        );

      }

    }
  );


/* =====================================
   LIMPAR FORMULÁRIO
===================================== */

function limparFormulario() {

  const confirmar =
    confirm(
      "Tem certeza que deseja limpar o formulário?"
    );


  if (!confirmar) {

    return;

  }


  document
    .getElementById("formAlta")
    .reset();


  document.getElementById(
    "dataAlta"
  ).value = hoje;


  if (paciente) {

    document.getElementById(
      "nome"
    ).value =
      decodeURIComponent(paciente);

  }

}

</script>
