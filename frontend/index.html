<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Sistema Hospitalar</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

<div class="container">

  <img
    src="css/cuidado.png"
    alt="Hospital Bom Cuidado"
  >

  <h2>🏥 Sistema Hospitalar</h2>


  <input
    id="usuario"
    type="text"
    placeholder="Usuário"
  >


  <input
    id="senha"
    type="password"
    placeholder="Senha"
  >


  <button onclick="login()">
    Entrar
  </button>

</div>


<script>

async function login() {

  const usuario =
    document.getElementById("usuario").value.trim();

  const senha =
    document.getElementById("senha").value;


  if (!usuario || !senha) {

    alert(
      "Preencha o usuário e a senha."
    );

    return;

  }


  try {

    const resposta =
      await fetch("/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          usuario,
          senha

        })

      });


    const data =
      await resposta.json();


    console.log(
      "Resposta do login:",
      data
    );


    if (!resposta.ok) {

      alert(
        data.erro ||
        "Login inválido."
      );

      return;

    }


    if (data.tipo === "triagem") {

      window.location.href =
        "triagem.html";

    }

    else if (data.tipo === "medico") {

      window.location.href =
        "medico.html";

    }

    else if (data.tipo === "atendimento") {

      window.location.href =
        "atendimento.html";

    }

    else {

      alert(
        "Tipo de usuário não reconhecido."
      );

    }

  }

  catch (erro) {

    console.error(erro);

    alert(
      "Não foi possível conectar ao servidor."
    );

  }

}

</script>

</body>

</html>
