<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

<div class="container">

  <h2>👨‍⚕️ Painel Médico</h2>

  <p>
    Pacientes aguardando atendimento médico
  </p>


  <div id="listaTriagens">

    Carregando pacientes...

  </div>


  <hr>


  <h3>📋 Registrar Consulta</h3>


  <input
    id="paciente"
    placeholder="Nome do paciente"
  >


  <textarea
    id="diagnostico"
    placeholder="Diagnóstico"
  ></textarea>


  <textarea
    id="medicacao"
    placeholder="Medicação prescrita"
  ></textarea>


  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>


  <button onclick="salvarConsulta()">
    💾 Salvar Consulta
  </button>


  <br><br>


  <button
    onclick="window.location.href='medicacao.html'"
  >
    💊 Ver Medicações
  </button>


  <br><br>


  <button
    onclick="window.location.href='alta.html'"
  >
    🏥 Alta Hospitalar
  </button>


  <br><br>


  <button
    onclick="window.location.href='index.html'"
  >
    ← Sair
  </button>

</div>


<script>


/* ==========================================
   CARREGAR TRIAGENS
========================================== */

async function carregarTriagens() {

  try {

    const resposta =
      await fetch("/triagens");


    const triagens =
      await resposta.json();


    const lista =
      document.getElementById(
        "listaTriagens"
      );


    lista.innerHTML = "";


    if (triagens.length === 0) {

      lista.innerHTML =
        "<p>Nenhuma triagem aguardando médico.</p>";

      return;

    }


    triagens.forEach(triagem => {

      lista.innerHTML += `

        <div class="card">

          <h3>
            👤 ${triagem.nome}
          </h3>

          <p>
            <b>Sintoma:</b>
            ${triagem.sintoma}
          </p>

          <p>
            <b>Temperatura:</b>
            ${triagem.temperatura || "Não informada"}
          </p>

          <p>
            <b>Alergias:</b>
            ${triagem.alergia || "Nenhuma informada"}
          </p>

          <p>
            <b>Risco:</b>
            ${triagem.risco.toUpperCase()}
          </p>

          <button
            onclick="selecionarPaciente('${triagem.nome.replace(/'/g, "\\'")}')"
          >
            Atender paciente
          </button>

        </div>

      `;

    });

  }

  catch (erro) {

    console.error(erro);

    document.getElementById(
      "listaTriagens"
    ).innerHTML =
      "<p>Erro ao carregar triagens.</p>";

  }

}


/* ==========================================
   SELECIONAR PACIENTE
========================================== */

function selecionarPaciente(nome) {

  document.getElementById(
    "paciente"
  ).value = nome;

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* ==========================================
   SALVAR CONSULTA
========================================== */

async function salvarConsulta() {

  const paciente =
    document.getElementById(
      "paciente"
    ).value;

  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value;

  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;

  const obs =
    document.getElementById(
      "obs"
    ).value;


  if (!paciente || !diagnostico) {

    alert(
      "Informe o paciente e o diagnóstico."
    );

    return;

  }


  try {

    const resposta =
      await fetch("/consulta", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          paciente,
          diagnostico,
          medicacao,
          obs

        })

      });


    const data =
      await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        "Erro ao salvar consulta."
      );

    }


    alert(
      "✓ Consulta salva com sucesso!"
    );


    document.getElementById(
      "diagnostico"
    ).value = "";


    document.getElementById(
      "medicacao"
    ).value = "";


    document.getElementById(
      "obs"
    ).value = "";


  }

  catch (erro) {

    console.error(erro);

    alert(
      "Não foi possível salvar a consulta."
    );

  }

}


carregarTriagens();

</script>

</body>

</html>
